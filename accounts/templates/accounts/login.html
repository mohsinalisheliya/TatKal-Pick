{% load static %}<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
  <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.remove('dark')}catch(e){}</script>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex items-center justify-center p-4 antialiased">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-slate-950 text-2xl shadow-lg shadow-amber-500/20"><i class="fa-solid fa-gem"></i></div>
      <h1 class="mt-4 text-2xl font-black tracking-tight">Tatkal Pick</h1>
      <p class="text-xs text-slate-500 mt-1">Sign in to continue</p>
    </div>
    <form method="post" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl shadow-black/5">
      {% csrf_token %}
      {% if form.errors %}<div class="px-4 py-2.5 rounded-xl text-xs font-bold bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-300"><i class="fa-solid fa-circle-exclamation mr-1"></i> Wrong username or password, or the account is disabled.</div>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <label class="block"><span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Username</span>
        <input name="username" autofocus autocomplete="username" required class="mt-1.5 w-full h-11 px-4 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-semibold focus:outline-none focus:border-amber-500"></label>
      <label class="block"><span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Password</span>
        <input name="password" type="password" autocomplete="current-password" required class="mt-1.5 w-full h-11 px-4 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-semibold focus:outline-none focus:border-amber-500"></label>
      <button class="w-full h-11 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm transition"><i class="fa-solid fa-right-to-bracket mr-1.5"></i> Sign in</button>
    </form>
    <p class="text-center text-[11px] text-slate-400 mt-4">Cashiers go to the counter, admins to inventory, the master admin to the control room.</p>
  </div>
</body>
</html>
