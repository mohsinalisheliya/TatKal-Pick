<!DOCTYPE html>
<html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Change password</title>
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'}</script>
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.remove('dark')}catch(e){}</script></head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex items-center justify-center p-4">
<form method="post" class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 space-y-3">
  {% csrf_token %}<h1 class="text-xl font-black">Change password</h1>
  {% for f in form %}<label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">{{ f.label }}
    <input type="password" name="{{ f.html_name }}" required class="mt-1 w-full h-10 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm normal-case font-semibold">
    {% for e in f.errors %}<span class="text-rose-500 normal-case font-semibold">{{ e }}</span>{% endfor %}</label>{% endfor %}
  <button class="w-full h-10 rounded-xl bg-amber-500 text-slate-950 font-black text-sm">Save</button>
  <a href="{% url 'role_home' %}" class="block text-center text-xs text-slate-400">Cancel</a>
</form></body></html>
