<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Master{% endblock %} - Control room</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}.mono{font-family:'JetBrains Mono',monospace}</style>
  <script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.remove('dark')}catch(e){}</script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen">
  <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3 px-4 sm:px-6">
    <div class="w-9 h-9 rounded-xl bg-violet-600 text-white flex items-center justify-center shadow-md shadow-violet-600/30"><i class="fa-solid fa-user-shield"></i></div>
    <div class="leading-tight mr-3"><div class="font-black text-sm">Control room</div><div class="text-[9px] uppercase font-bold tracking-wider text-violet-500">Master admin</div></div>
    <nav class="flex items-center gap-1">
      <a href="{% url 'master_home' %}" class="px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 {% if tab == 'home' %}bg-violet-600 text-white{% else %}text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800{% endif %}"><i class="fa-solid fa-chart-pie"></i><span class="hidden sm:inline">Overview</span></a>
      <a href="{% url 'master_users' %}" class="px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 {% if tab == 'users' %}bg-violet-600 text-white{% else %}text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800{% endif %}"><i class="fa-solid fa-users-gear"></i><span class="hidden sm:inline">Users &amp; roles</span></a>
      <a href="{% url 'master_logs' %}" class="px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 {% if tab == 'logs' %}bg-violet-600 text-white{% else %}text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800{% endif %}"><i class="fa-solid fa-clipboard-list"></i><span class="hidden sm:inline">Activity log</span></a>
    </nav>
    <div class="flex-1"></div>
    <a href="{% url 'dashboard' %}" class="hidden sm:inline-flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"><i class="fa-solid fa-gauge-high"></i> Admin app</a>
    <a href="{% url 'pos' %}" class="hidden sm:inline-flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"><i class="fa-solid fa-cash-register"></i> Counter</a>
    <a href="{% url 'logout' %}" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-rose-500 hover:bg-rose-600 text-white"><i class="fa-solid fa-right-from-bracket"></i><span class="hidden sm:inline">Logout</span></a>
  </header>
  {% if messages %}<div class="max-w-6xl mx-auto px-4 sm:px-6 pt-4 space-y-2">
    {% for m in messages %}<div class="px-4 py-2.5 rounded-xl text-xs font-bold border {% if m.tags == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-600 dark:text-rose-300{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-700 dark:text-emerald-300 mono{% endif %}">{{ m }}</div>{% endfor %}</div>{% endif %}
  <main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-5">{% block body %}{% endblock %}</main>
</body>
</html>
