{% extends "masteradmin/base.html" %}
{% block title %}Set password{% endblock %}
{% block body %}
<div><a href="{% url 'master_users' %}" class="text-xs font-bold text-violet-500">&larr; All users</a>
<h1 class="text-2xl font-black tracking-tight mt-1">Set password for {{ target.username }}</h1>
<p class="text-xs text-slate-500 mt-1">You choose the password. Their old password stops working immediately.</p></div>
<form method="post" class="max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 space-y-3 text-xs">
  {% csrf_token %}
  <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px]">New password (min 6)
    <input name="password" type="text" autocomplete="off" required autofocus class="mt-1 w-full h-10 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-semibold normal-case mono"></label>
  <label class="block font-bold text-slate-400 uppercase tracking-wider text-[10px]">Type it again
    <input name="password2" type="text" autocomplete="off" required class="mt-1 w-full h-10 px-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-semibold normal-case mono"></label>
  <div class="flex justify-end gap-2 pt-1"><a href="{% url 'master_users' %}" class="h-10 px-4 inline-flex items-center rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">Cancel</a><button class="h-10 px-6 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-black">Save password</button></div>
</form>
{% endblock %}
